group = "com.example.ntbp_plugin"
version = "3.0.0"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// The Xprinter SDK ships as a local Maven repository inside the plugin
// (android/libs/repo). Gradle resolves a library's dependencies with the
// consuming app's repositories, so the repository is registered on every
// project of the build, not only on this module.
def xprinterSdkRepo = file("${project.projectDir}/libs/repo").toURI()
rootProject.allprojects {
    repositories {
        maven { url xprinterSdkRepo }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url xprinterSdkRepo }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.example.ntbp_plugin"

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        // The Xprinter printer-lib requires API 21.
        minSdk = 21
    }

    dependencies {
        // Xprinter / net.posprinter SDK (Bluetooth SPP transport, TSPL helpers,
        // printer status query). Served from android/libs/repo.
        implementation "net.posprinter:printer-lib:3.5.8"

        implementation "androidx.core:core-ktx:1.12.0"
        implementation "androidx.appcompat:appcompat:1.6.1"
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
